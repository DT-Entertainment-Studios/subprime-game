# Air config for the hot-reload backend used by `make dev-backend`
# (docker-compose-dev-hot.yaml / Readme.md). Air is started from backend/, so
# paths below are relative to backend/. tmp/ holds the dev binary between
# rebuilds and is covered by .gitignore, as is .tools/ (where make installs
# air).

root = "."
tmp_dir = "tmp"

[build]
    # Rebuild ./cmd/subprime on every change and restart it. POLLING is the
    # key knob: on bind mounts (editor ↔ make dev container) inotify never
    # fires, so without it nothing triggers a rebuild. The listen port (8090,
    # must match SUBPRIME_API_URL in docker-compose-dev-hot.yaml) is exported
    # by the container command.
    cmd = "go build -o tmp/dev ./cmd/subprime"
    bin = "tmp/dev"
    full_bin = "./tmp/dev"
    include_ext = ["go"]
    exclude_dir = ["tmp", ".tools"]
    poll = true
    poll_interval = 1000 # ms
