<!doctype html>
<html lang="de">
	<head>
		<script>
			// Theme bootstrap: runs before the stylesheet is applied, so a dark
			// reload never flashes light. Same key and default as lib/preferences.ts.
			(function () {
				var theme = 'light';
				try {
					var raw = localStorage.getItem('subprime.preferences');
					var prefs = raw ? JSON.parse(raw) : null;
					if (prefs && prefs.theme === 'dark') theme = 'dark';
				} catch (error) {
					theme = 'light';
				}
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="app" content="subprime" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
